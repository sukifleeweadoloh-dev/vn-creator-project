<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>สร้างนิยาย - VN Creator</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/create.css">
    <link rel="stylesheet" href="css/cookie-consent.css">
    
    <!-- Library สำหรับ Drag & Drop และ Cut Background -->
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/browser.js"></script>
</head>
<body>
    <!-- แถบด้านบน -->
    <div class="top-bar">
        <a href="index.html">🏠 กลับหน้าหลัก</a>
        <div style="display:flex; gap:10px;">
            <button id="btn-add-bg">🖼️ เพิ่มพื้นหลัง</button>
            <button id="btn-save">💾 บันทึก</button>
            <button id="btn-play">▶️ เล่น/อ่าน</button>
        </div>
    </div>

    <div class="editor-container">
        <!-- Sidebar ซ้าย -->
        <div class="sidebar">
            <label style="font-size:14px; color:#666;">เลือกเรื่องที่จะแก้ไข:</label>
            <select id="select-existing-novel" style="padding:8px; border-radius:8px; margin-bottom:10px;">
                <option value="">-- สร้างเรื่องใหม่ --</option>
            </select>

            <!-- [เพิ่มใหม่] ส่วนสำหรับอัปโหลดรูปปกและกรอกแท็ก -->
            <div style="background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 10px;">
                <label style="font-size:14px; color:#666; display:block; margin-bottom:5px;">รูปภาพปกเรื่อง:</label>
                
                <!-- ปุ่มสำหรับเปิดหน้าต่างอัปโหลด (รูปภาพจะถูกซ่อนไว้) -->
                <input type="file" id="cover-input" accept="image/*" style="display:none;">
                <button id="btn-upload-cover" style="width:100%; margin-bottom:8px; padding:8px; font-size:13px; background:#e2e8f0; border:none; border-radius:5px; cursor:pointer;">📸 อัปโหลดรูปปก</button>
                
                <!-- รูปภาพพรีวิว (ซ่อนไว้ก่อน ถ้ามีรูปค่อยแสดง) -->
                <img id="cover-preview" src="" style="width: 100%; max-height: 120px; object-fit: cover; border-radius: 8px; display: none; margin-bottom: 10px;">

                <label style="font-size:14px; color:#666; display:block; margin-bottom:5px;">แท็ก (คั่นด้วยจุลภาค):</label>
                <!-- ช่องกรอกแท็ก (ไม่บังคับ) -->
                <input type="text" id="input-tags" placeholder="เช่น fantasy, ต่อสู้, โรแมนติก" style="width:100%; padding:8px; border-radius:8px; border:1px solid #cbd5e1; font-family:'Prompt'; font-size:13px;">
            </div>
            <!-- ------------------------------------------------------- -->

            <button id="btn-add-character">+ เพิ่มตัวละคร</button>
            <button id="btn-add-dialogue">+ เพิ่มบทพูด</button>
            
            <hr>
            
            <!-- รายการหน้า (Thumbnails) -->
            <div id="page-list"></div>
            
            <!-- ปุ่มเพิ่มหน้าใหม่ -->
            <button id="btn-add-page">+ เพิ่มหน้าใหม่</button>
        </div>

        <!-- Canvas ตรงกลาง (พื้นที่ทำงาน) -->
        <div class="canvas" id="canvas">
            <!-- Object ตัวละครและบทพูดจะถูกสร้างที่นี่โดย JS -->
        </div>
    </div>
    
    <!-- ⚠️ ลำดับการโหลด Script สำคัญมาก ห้ามสลับ ⚠️ -->
    <script src="js/config.js"></script>
    <script src="js/cookie-consent.js"></script>
    <script src="js/create.js"></script>
</body>
</html>
