<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สร้างนิยาย - VN Creator</title>
    
    <!-- CSS หลักและ CSS ของหน้าสร้าง -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/create.css">
    
    <!-- Library สำหรับ Drag & Drop และ Cut Background -->
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/browser.js"></script>
</head>
<body>
    <!-- แถบด้านบน -->
    <div class="top-bar">
        <a href="index.html">🏠 กลับหน้าหลัก</a>
        <div style="display:flex; gap:10px;">
            <button id="btn-add-bg">🖼️ พื้นหลัง</button>
            <button id="btn-save">💾 บันทึก</button>
            <button id="btn-play">▶️ เล่น/อ่าน</button>
        </div>
    </div>

    <div class="editor-container">
        <!-- Sidebar ซ้าย -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="form-group">
                    <label>เลือกเรื่องที่จะแก้ไข:</label>
                    <select id="select-existing-novel" class="form-control">
                        <option value="">-- สร้างเรื่องใหม่ --</option>
                    </select>
                </div>

                <!-- อัปโหลดรูปภาพปกเรื่อง -->
                <div class="form-group">
                    <label>รูปภาพปกเรื่อง:</label>
                    <input type="file" id="cover-input" accept="image/*" style="display:none;">
                    <div class="upload-btn" id="btn-upload-cover">
                        📸 อัปโหลดรูปปกเรื่อง
                    </div>
                    <img id="cover-preview" src="" style="width: 100%; max-height: 80px; object-fit: cover; border-radius: 8px; display: none; margin-top: 5px;">
                </div>

                <!-- อัปโหลดรูปภาพปกตอน -->
                <div class="form-group">
                    <label>รูปภาพปกตอน:</label>
                    <input type="file" id="chapter-cover-input" accept="image/*" style="display:none;">
                    <div class="upload-btn" id="btn-upload-chapter-cover">
                        🖼️ อัปโหลดรูปปกตอน
                    </div>
                    <img id="chapter-cover-preview" src="" style="width: 100%; max-height: 80px; object-fit: cover; border-radius: 8px; display: none; margin-top: 5px;">
                </div>

                <!-- ช่องกรอกแท็ก -->
                <div class="form-group">
                    <label>แท็ก (คั่นด้วยจุลภาค):</label>
                    <input type="text" id="input-tags" class="form-control" placeholder="เช่น fantasy, ต่อสู้">
                </div>
            </div>

            <div class="sidebar-content">
                <!-- ปุ่มเพิ่ม Object -->
                <button class="btn btn-secondary" id="btn-add-character">+ เพิ่มตัวละคร</button>
                <button class="btn btn-secondary" id="btn-add-dialogue">+ เพิ่มบทพูด</button>
                
                <!-- ปุ่มเพิ่มตัวเลือก -->
                <button class="btn btn-secondary" id="btn-add-choice">+ เพิ่มตัวเลือก</button>
                
                <!-- ปุ่มไปหน้า Story Line -->
                <button class="btn btn-storyline" id="btn-go-storyline" style="background: #e0e7ff; color: #4f46e5; border: 1px solid #c7d2fe; margin-top: 5px;">
                    🔗 ไปที่ Story Line
                </button>

                <div class="divider"></div>

                <!-- รายการหน้า (Thumbnails) -->
                <label style="font-size: 13px; color: var(--text-light); margin-bottom: 5px; display: block;">รายการหน้า:</label>
                <div id="page-list" class="page-list"></div>
            </div>

            <div class="sidebar-footer">
                <!-- ปุ่มเพิ่มหน้าใหม่ -->
                <button class="btn btn-secondary" id="btn-add-page" style="width: 100%;">+ เพิ่มหน้าใหม่</button>
            </div>
        </div>

        <!-- Canvas ตรงกลาง (พื้นที่ทำงาน) -->
        <div class="canvas-wrapper">
            <div class="canvas" id="canvas">
                <!-- Object ตัวละครและบทพูดจะถูกสร้างที่นี่โดย JS -->
            </div>
        </div>
    </div>
    
    <!-- ⚠️ ลำดับการโหลด Script ⚠️ -->
    <script src="js/config.js"></script>
    <script src="js/cookie-consent.js"></script>
    <script src="js/create.js"></script>
</body>
</html>
