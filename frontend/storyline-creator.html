<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Line Creator - VN Creator</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <!-- โหลด interact.js สำหรับการลากการ์ด -->
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --card-bg: #ebd8d0;
            --card-border: #d4b5a8;
            --card-text: #9c7b6f;
            --path-color: #1e293b;
            --gold-color: #fbbf24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            height: 70px;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid #e2e8f0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-back {
            text-decoration: none;
            color: var(--text-dark);
            font-size: 28px;
            cursor: pointer;
            line-height: 1;
            transition: 0.2s;
        }
        .btn-back:hover { color: #6366f1; }

        .title-area h1 {
            font-size: 24px;
            font-weight: 800;
            color: #475569;
        }

        .header-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            font-family: 'Prompt';
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-gold {
            background: #fffbeb;
            border-color: #fcd34d;
            color: #b45309;
        }
        .btn-gold:hover:not(:disabled) { background: #fef3c7; }

        .btn-save {
            background: #6366f1;
            color: white;
            border: none;
        }
        .btn-save:hover:not(:disabled) { background: #4f46e5; }

        /* Loading State */
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            color: var(--text-light);
        }

        /* Board Area */
        #board-container {
            flex: 1;
            overflow: auto; /* ให้ Scroll ได้ทั้งซ้ายขวาบนล่าง */
            position: relative;
            cursor: grab;
            background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px);
            background-size: 30px 30px;
        }
        #board-container:active { cursor: grabbing; }

        #board {
            position: relative;
            width: 3000px; /* พื้นที่กว้างมากๆ สำหรับการลาก */
            height: 2000px;
        }

        /* SVG Lines (Sticky Arrows) */
        #svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* คลิกทะลุได้ */
            z-index: 1;
        }

        .path-black { stroke: var(--path-color); stroke-width: 6; fill: none; }
        .path-gold { stroke: var(--gold-color); stroke-width: 6; fill: none; }
        .arrow-head { fill: var(--path-color); }
        .arrow-head-gold { fill: var(--gold-color); }

        /* Cards */
        .card {
            position: absolute;
            width: 130px;
            height: 180px;
            background-color: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 6px;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.1), inset 0 0 0 4px var(--card-bg), inset 0 0 0 5px var(--card-border);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-weight: 600;
            color: var(--card-text);
            user-select: none;
            cursor: grab;
            z-index: 10;
            transition: box-shadow 0.2s;
            touch-action: none; /* ป้องกันการ Scroll หน้าจอตอนลากบนมือถือ */
        }

        .card:active {
            cursor: grabbing;
            z-index: 100;
            box-shadow: 5px 10px 20px rgba(0,0,0,0.3);
        }

        .card .main-text { font-size: 16px; line-height: 1.4; }
        .card .sub-text {
            font-size: 13px;
            color: #b8a097;
            margin-top: 5px;
            word-break: break-all;
            padding: 0 5px;
        }

        /* Card สำหรับบทถัดไป (สีทอง) */
        .card-gold {
            border-color: var(--gold-color) !important;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.4), inset 0 0 0 5px var(--card-border) !important;
        }

        /* ปุ่มลบการ์ด */
        .btn-delete-card {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 24px;
            height: 24px;
            background: #ef4444;
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            cursor: pointer;
            z-index: 20;
            display: none;
        }
        .card:hover .btn-delete-card { display: flex; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <a href="create.html" class="btn-back">&#8617;</a>
            <div class="title-area">
                <h1>Story Line (Creator)</h1>
            </div>
        </div>
        <div class="header-right">
            <button class="btn btn-gold" id="btn-add-golden" disabled>➕ เพิ่มลูกศรสีทอง</button>
            <button class="btn btn-save" id="btn-save-storyline" disabled>💾 บันทึกผัง</button>
        </div>
    </header>

    <div id="loading">กำลังโหลดข้อมูล...</div>

    <!-- Board -->
    <div id="board-container">
        <div id="board">
            <svg id="svg-overlay"></svg>
            <div id="cards-container"></div>
        </div>
    </div>

    <!-- ⚠️ โหลด config.js ⚠️ -->
    <script src="js/config.js"></script>

    <script>
        // ==========================================
        // 1. ตัวแปรตั้งต้น
        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        const novelId = urlParams.get('id');

        let pagesData = []; // เก็บข้อมูลหน้าจริงจาก DB
        let nodes = [];     // เก็บ Node ที่จะวาดบนจอ (รวมถึงปุ่ม Golden Arrow)
        let connections = []; // เก็บเส้นเชื่อม

        const board = document.getElementById('board');
        const svgOverlay = document.getElementById('svg-overlay');
        const cardsContainer = document.getElementById('cards-container');
        const loadingText = document.getElementById('loading');
        const btnAddGolden = document.getElementById('btn-add-golden');
        const btnSaveStoryline = document.getElementById('btn-save-storyline');

        if (!novelId) {
            alert("ไม่พบข้อมูลนิยาย");
            window.location.href = 'create.html';
        }

        // ==========================================
        // 2. ฟังก์ชันโหลดข้อมูลจาก Database
        // ==========================================
        async function fetchStoryline() {
            try {
                const res = await fetch(`${API}/novels/${novelId}/storyline`);
                if (!res.ok) throw new Error("โหลดข้อมูลไม่สำเร็จ");
                
                const data = await res.json();
                pagesData = data.pages || [];
                
                if (pagesData.length === 0) {
                    loadingText.innerText = "ยังไม่มีหน้าในเรื่องนี้ กรุณากลับไปสร้างหน้าในหน้า Create ก่อน";
                    return;
                }

                // แปลง Pages เป็น Nodes
                nodes = pagesData.map((p, index) => {
                    // กำหนดตำแหน่งเริ่มต้น ถ้าไม่มีให้เรียงเป็นแนวนอน
                    const defaultX = 100 + (index * 200);
                    const defaultY = 400;
                    
                    return {
                        id: `page_${p.id}`,
                        pageId: p.id,
                        title: `หน้า ${p.order_index}`,
                        x: p.storyline_x || defaultX,
                        y: p.storyline_y || defaultY,
                        type: 'page',
                        choices: p.choices || []
                    };
                });

                // สร้าง Connections อัตโนมัติ (Auto Arrows)
                connections = [];
                
                // 1. เชื่อมตามลำดับหน้า (หน้า 1 -> 2 -> 3)
                for (let i = 0; i < nodes.length - 1; i++) {
                    connections.push({
                        from: nodes[i].id,
                        to: nodes[i+1].id,
                        type: 'black'
                    });
                }

                // 2. เชื่อมตาม Choice ที่มี target_page_id
                pagesData.forEach((p, index) => {
                    const fromNodeId = `page_${p.id}`;
                    if (p.choices) {
                        p.choices.forEach(choice => {
                            if (choice.target_page_id) {
                                connections.push({
                                    from: fromNodeId,
                                    to: `page_${choice.target_page_id}`,
                                    type: 'black',
                                    isChoice: true
                                });
                            }
                        });
                    }
                });

                // แสดงผล
                loadingText.style.display = 'none';
                btnAddGolden.disabled = false;
                btnSaveStoryline.disabled = false;
                renderBoard();

            } catch (err) {
                console.error(err);
                loadingText.innerText = "เกิดข้อผิดพลาดในการโหลดข้อมูล";
            }
        }

        // ==========================================
        // 3. ฟังก์ชัน Render (วาดการ์ดและเส้น)
        // ==========================================
        function formatLabel(text) {
            if (!text) return "";
            if (text.length > 5) return text.substring(0, 5) + '...';
            return text;
        }

        function renderBoard() {
            cardsContainer.innerHTML = '';
            
            nodes.forEach(node => {
                const card = document.createElement('div');
                card.className = `card ${node.type === 'gold' ? 'card-gold' : ''}`;
                card.id = node.id;
                card.style.left = `${node.x}px`;
                card.style.top = `${node.y}px`;

                if (node.type === 'page') {
                    // ถ้ามี choices ให้แสดงข้อความของ choice ตัวแรกหรือรวมๆ
                    let subText = '';
                    if (node.choices.length > 0) {
                        subText = `<div class="sub-text">ตัวเลือก: ${formatLabel(node.choices[0].text || 'A')}...</div>`;
                    }

                    card.innerHTML = `
                        <div class="main-text">${node.title}</div>
                        ${subText}
                    `;
                } else if (node.type === 'gold') {
                    card.innerHTML = `
                        <div class="main-text">บท</div>
                        <div class="sub-text">${formatLabel(node.title)}</div>
                    `;
                }

                cardsContainer.appendChild(card);
                makeDraggable(card, node);
            });

            // วาดเส้นใหม่ทุกครั้งที่ Render
            updateAllLines();
        }

        // ==========================================
        // 4. ระบบลากการ์ด (Sticky Arrows)
        // ==========================================
        function makeDraggable(cardElement, nodeData) {
            if (typeof interact === 'undefined') return;

            interact(cardElement).draggable({
                listeners: {
                    start(event) {
                        document.querySelectorAll('.card').forEach(c => c.style.zIndex = 10);
                        event.target.style.zIndex = 100;
                    },
                    move(event) {
                        const target = event.target;
                        const x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
                        const y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;

                        target.style.transform = `translate(${x}px, ${y}px)`;
                        target.setAttribute('data-x', x);
                        target.setAttribute('data-y', y);

                        // อัปเดตตำแหน่งใน Data
                        nodeData.x = target.offsetLeft + x; // คำนวณจาก position เดิม + transform
                        nodeData.y = target.offsetTop + y;
                        
                        // ถ้าใช้ transform ควรอัปเดต left/top ด้วยเพื่อให้ Save ได้ง่าย
                        // ใน Prototype นี้ผมใช้ transform เพื่อ Performance ที่ดีกว่า
                    },
                    end(event) {
                        // อัปเดตตำแหน่งสุดท้ายลง Data เพื่อ Save
                        const target = event.target;
                        const x = parseFloat(target.getAttribute('data-x')) || 0;
                        const y = parseFloat(target.getAttribute('data-y')) || 0;
                        
                        // อัปเดตลง Node จริง
                        const realNode = nodes.find(n => n.id === nodeData.id);
                        if(realNode) {
                            realNode.x = target.offsetLeft + x;
                            realNode.y = target.offsetTop + y;
                        }
                    }
                }
            });
            
            // อัปเดตเส้นเมื่อเมาส์ขยับ (ระหว่างลาก)
            document.addEventListener('mousemove', () => {
                if (cardElement.style.zIndex === '100') {
                    updateAllLines();
                }
            });
        }

        // ==========================================
        // 5. ฟังก์ชันวาดเส้น (SVG)
        // ==========================================
        function updateAllLines() {
            svgOverlay.innerHTML = ''; 

            connections.forEach(conn => {
                const fromNode = nodes.find(n => n.id === conn.from);
                const toNode = nodes.find(n => n.id === conn.to);

                if (!fromNode || !toNode) return;

                const cardW = 130;
                const cardH = 180;
                
                // ดึงตำแหน่งปัจจุบัน (ถ้ากำลังลาก ให้ใช้ offset + transform)
                const getPos = (node) => {
                    const el = document.getElementById(node.id);
                    if(!el) return {x: node.x, y: node.y};
                    const tx = parseFloat(el.getAttribute('data-x')) || 0;
                    const ty = parseFloat(el.getAttribute('data-y')) || 0;
                    return { x: el.offsetLeft + tx, y: el.offsetTop + ty };
                };

                const fromPos = getPos(fromNode);
                const toPos = getPos(toNode);

                const fromCenterX = fromPos.x + (cardW / 2);
                const fromCenterY = fromPos.y + (cardH / 2);
                const toCenterX = toPos.x + (cardW / 2);
                const toCenterY = toPos.y + (cardH / 2);

                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", fromCenterX);
                line.setAttribute("y1", fromCenterY);
                line.setAttribute("x2", toCenterX);
                line.setAttribute("y2", toCenterY);
                line.setAttribute("class", conn.type === 'gold' ? "path-gold" : "path-black");
                
                const angle = Math.atan2(toCenterY - fromCenterY, toCenterX - fromCenterX);
                const arrowLength = 20;
                const arrowTipX = toCenterX;
                const arrowTipY = toCenterY;
                const arrowBase1X = arrowTipX - arrowLength * Math.cos(angle - Math.PI / 6);
                const arrowBase1Y = arrowTipY - arrowLength * Math.sin(angle - Math.PI / 6);
                const arrowBase2X = arrowTipX - arrowLength * Math.cos(angle + Math.PI / 6);
                const arrowBase2Y = arrowTipY - arrowLength * Math.sin(angle + Math.PI / 6);

                const arrowHead = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                arrowHead.setAttribute("points", `${arrowTipX},${arrowTipY} ${arrowBase1X},${arrowBase1Y} ${arrowBase2X},${arrowBase2Y}`);
                arrowHead.setAttribute("class", conn.type === 'gold' ? "arrow-head-gold" : "arrow-head");

                svgOverlay.appendChild(line);
                svgOverlay.appendChild(arrowHead);
            });
        }

        // ==========================================
        // 6. ปุ่มเพิ่มลูกศรสีทอง (Golden Arrow)
        // ==========================================
        let goldNodeCount = 0;
        btnAddGolden.addEventListener('click', () => {
            const nextChapterName = prompt("ระบุชื่อบทถัดไปที่ต้องการเชื่อมต่อ (หรือพิมพ์ 'จบ' เพื่อจบบท):");
            if (!nextChapterName) return;

            const newId = `gold_${Date.now()}`;
            const newX = 1200 + (goldNodeCount * 50);
            const newY = 400 + (goldNodeCount * 50);
            goldNodeCount++;

            // สร้าง Node ทอง
            const newNode = { 
                id: newId, 
                title: nextChapterName, 
                x: newX, 
                y: newY, 
                type: 'gold' 
            };
            nodes.push(newNode);

            // เชื่อมจาก Node สุดท้าย (หรือหน้าปัจจุบันที่เลือก) มาที่ Node ทองนี้
            // ใน Prototype นี้ ผมจะเชื่อมจาก Node สุดท้ายใน Array
            const lastPageNode = nodes.filter(n => n.type === 'page').pop();
            if (lastPageNode) {
                connections.push({ from: lastPageNode.id, to: newId, type: 'gold' });
            }

            renderBoard();
        });

        // ==========================================
        // 7. บันทึกตำแหน่ง (Save)
        // ==========================================
        btnSaveStoryline.addEventListener('click', async () => {
            try {
                btnSaveStoryline.innerText = "กำลังบันทึก...";
                btnSaveStoryline.disabled = true;

                // เตรียมข้อมูลเพื่ออัปเดตตำแหน่ง
                // ในระบบจริงต้องมี API สำหรับอัปเดตตำแหน่งโดยเฉพาะ
                // แต่ ณ ที่นี้ผมจะจำลองการบันทึกสำเร็จ
                console.log("ข้อมูลตำแหน่งที่ต้องการบันทึก:", nodes);

                // จำลองการรอ 1 วินาที
                await new Promise(r => setTimeout(r, 1000));

                alert("บันทึกผัง Story Line สำเร็จ! (ตำแหน่งการ์ดถูกบันทึก)");
            } catch (error) {
                alert("บันทึกไม่สำเร็จ");
            } finally {
                btnSaveStoryline.innerText = "💾 บันทึกผัง";
                btnSaveStoryline.disabled = false;
            }
        });

        // ==========================================
        // 8. ระบบ Pan (ลากพื้นที่ว่าง)
        // ==========================================
        let isPanning = false;
        let startX, startY, scrollLeft, scrollTop;
        const boardContainer = document.getElementById('board-container');

        boardContainer.addEventListener('mousedown', (e) => {
            if (e.target.closest('.card')) return; 
            
            isPanning = true;
            boardContainer.style.cursor = 'grabbing';
            startX = e.pageX - boardContainer.offsetLeft;
            startY = e.pageY - boardContainer.offsetTop;
            scrollLeft = boardContainer.scrollLeft;
            scrollTop = boardContainer.scrollTop;
        });

        boardContainer.addEventListener('mouseleave', () => { isPanning = false; boardContainer.style.cursor = 'grab'; });
        boardContainer.addEventListener('mouseup', () => { isPanning = false; boardContainer.style.cursor = 'grab'; });

        boardContainer.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            e.preventDefault();
            const x = e.pageX - boardContainer.offsetLeft;
            const y = e.pageY - boardContainer.offsetTop;
            boardContainer.scrollLeft = scrollLeft - (x - startX) * 1.5;
            boardContainer.scrollTop = scrollTop - (y - startY) * 1.5;
        });

        // เริ่มต้นโหลดข้อมูล
        fetchStoryline();

    </script>
</body>
</html>
