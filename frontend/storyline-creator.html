<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Line Creator - VN Creator</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    
    <!-- Library สำหรับการลากการ์ด -->
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    
    <!-- CSS หลัก และ CSS ของหน้า Story Line -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/storyline.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <a href="create.html" class="btn-back">&#8617;</a>
            <div class="title-area">
                <h1>Story Line (Creator)</h1>
            </div>
        </div>
        <div class="header-right">
            <button class="btn btn-gold" id="btn-add-golden" disabled>➕ เพิ่มลูกศรสีทอง</button>
            <button class="btn btn-save" id="btn-save-storyline" disabled>💾 บันทึกผัง</button>
        </div>
    </header>

    <!-- สถานะกำลังโหลด -->
    <div id="loading">กำลังโหลดข้อมูล...</div>

    <!-- พื้นที่บอร์ดสำหรับวาดผัง -->
    <div id="board-container">
        <div id="board">
            <svg id="svg-overlay"></svg>
            <div id="cards-container"></div>
        </div>
    </div>

    <!-- ⚠️ ลำดับการโหลด Script ⚠️ -->
    <script src="js/config.js"></script>
    <script src="js/storyline-creator.js"></script>
</body>
</html>
