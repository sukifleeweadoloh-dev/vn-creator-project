<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Line Creator - VN Creator</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --card-bg: #ebd8d0;
            --card-border: #d4b5a8;
            --card-text: #9c7b6f;
            --path-color: #1e293b;
            --gold-color: #fbbf24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            height: 70px;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid #e2e8f0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-back {
            text-decoration: none;
            color: var(--text-dark);
            font-size: 28px;
            cursor: pointer;
            line-height: 1;
            transition: 0.2s;
        }
        .btn-back:hover { color: #6366f1; }

        .title-area h1 {
            font-size: 24px;
            font-weight: 800;
            color: #475569;
        }

        .header-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-gold {
            background: #fffbeb;
            border-color: #fcd34d;
            color: #b45309;
        }
        .btn-gold:hover { background: #fef3c7; }

        .btn-save {
            background: #6366f1;
            color: white;
            border: none;
        }
        .btn-save:hover { background: #4f46e5; }

        /* Board Area */
        #board-container {
            flex: 1;
            overflow: auto;
            position: relative;
            cursor: grab;
            background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px);
            background-size: 30px 30px;
        }
        #board-container:active { cursor: grabbing; }

        #board {
            position: relative;
            width: 3000px; 
            height: 2000px;
        }

        /* SVG Lines */
        #svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .path-black { stroke: var(--path-color); stroke-width: 6; fill: none; }
        .path-gold { stroke: var(--gold-color); stroke-width: 6; fill: none; }
        .arrow-head { fill: var(--path-color); }
        .arrow-head-gold { fill: var(--gold-color); }

        /* Cards */
        .card {
            position: absolute;
            width: 130px;
            height: 180px;
            background-color: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 6px;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.1), inset 0 0 0 4px var(--card-bg), inset 0 0 0 5px var(--card-border);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-weight: 600;
            color: var(--card-text);
            user-select: none;
            cursor: grab;
            z-index: 10;
            transition: box-shadow 0.2s;
        }

        .card:active {
            cursor: grabbing;
            z-index: 100;
            box-shadow: 5px 10px 20px rgba(0,0,0,0.3);
        }

        .card .main-text { font-size: 16px; line-height: 1.4; }
        .card .sub-text {
            font-size: 13px;
            color: #b8a097;
            margin-top: 5px;
            word-break: break-all;
            padding: 0 5px;
        }

        /* ปุ่มลบการ์ด (สำหรับ Creator) */
        .btn-delete-card {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 24px;
            height: 24px;
            background: #ef4444;
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            cursor: pointer;
            z-index: 20;
            display: none; /* ซ่อนไว้ก่อน จะโชว์ตอน hover */
        }
        .card:hover .btn-delete-card { display: flex; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <a href="create.html" class="btn-back">&#8617;</a>
            <div class="title-area">
                <h1>Story Line (Creator)</h1>
            </div>
        </div>
        <div class="header-right">
            <button class="btn btn-gold" onclick="addGoldenArrow()">➕ เพิ่มลูกศรสีทอง</button>
            <button class="btn btn-save" onclick="saveStoryline()">💾 บันทึกผัง</button>
        </div>
    </header>

    <!-- Board -->
    <div id="board-container">
        <div id="board">
            <svg id="svg-overlay"></svg>
            <div id="cards-container"></div>
        </div>
    </div>

    <script>
        const board = document.getElementById('board');
        const svgOverlay = document.getElementById('svg-overlay');
        const cardsContainer = document.getElementById('cards-container');
        const boardContainer = document.getElementById('board-container');

        // ==========================================
        // 1. Mock Data (จำลองข้อมูลจากหน้า Create)
        // ในระบบจริง ข้อมูลนี้จะถูกดึงจาก Database ตาม novel_id และ chapter_id
        // ==========================================
        let nodes = [
            { id: 'page1', title: 'หน้า 1', x: 100, y: 400, type: 'page' },
            { id: 'page2', title: 'หน้า 2', x: 350, y: 400, type: 'page' },
            { id: 'choiceA', title: 'สวัสดีชาวโลก', x: 650, y: 250, type: 'choice' }, // 5 ตัวแรกคือ สวัสดี...
            { id: 'choiceB', title: 'ลาก่อนนะครับ', x: 650, y: 550, type: 'choice' }, // 5 ตัวแรกคือ ลาก่อ...
            { id: 'page3', title: 'หน้า 3', x: 950, y: 250, type: 'page' }
        ];

        // การเชื่อมโยง (Auto-generated ในระบบจริง)
        let connections = [
            { from: 'page1', to: 'page2', type: 'black' },
            { from: 'page2', to: 'choiceA', type: 'black' },
            { from: 'page2', to: 'choiceB', type: 'black' },
            { from: 'choiceA', to: 'page3', type: 'black' }
        ];

        // ==========================================
        // 2. ฟังก์ชัน Render (วาดการ์ดและเส้น)
        // ==========================================
        function formatLabel(text) {
            if (text.length > 5) return text.substring(0, 5) + '...';
            return text;
        }

        function renderBoard() {
            cardsContainer.innerHTML = '';
            svgOverlay.innerHTML = '';

            // 2.1 วาดการ์ด
            nodes.forEach(node => {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = node.id;
                card.style.left = `${node.x}px`;
                card.style.top = `${node.y}px`;

                if (node.type === 'choice') {
                    card.innerHTML = `
                        <div class="main-text">หน้า</div>
                        <div class="sub-text">${formatLabel(node.title)}</div>
                        <div class="btn-delete-card" onclick="deleteNode('${node.id}')">-</div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="main-text">${node.title}</div>
                        <div class="btn-delete-card" onclick="deleteNode('${node.id}')">-</div>
                    `;
                }

                cardsContainer.appendChild(card);
                makeDraggable(card, node);
            });

            // 2.2 วาดเส้นเริ่มต้น
            updateAllLines();
        }

        // ==========================================
        // 3. ระบบลากการ์ด และอัปเดตเส้น (Sticky Arrows)
        // ==========================================
        function makeDraggable(cardElement, nodeData) {
            let isDragging = false;
            let offsetX, offsetY;

            cardElement.addEventListener('mousedown', (e) => {
                // ถ้าคลิกที่ปุ่มลบ ไม่ต้องลาก
                if (e.target.classList.contains('btn-delete-card')) return;

                isDragging = true;
                cardElement.style.cursor = 'grabbing';
                
                const rect = cardElement.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                
                document.querySelectorAll('.card').forEach(c => c.style.zIndex = 10);
                cardElement.style.zIndex = 100;
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                const boardRect = board.getBoundingClientRect();
                
                // อัปเดตตำแหน่ง Node ใน Data
                nodeData.x = e.clientX - boardRect.left - offsetX;
                nodeData.y = e.clientY - boardRect.top - offsetY;

                // อัปเดตตำแหน่ง DOM
                cardElement.style.left = `${nodeData.x}px`;
                cardElement.style.top = `${nodeData.y}px`;

                // อัปเดตเส้นแบบ Real-time
                updateAllLines(); 
            });

            document.addEventListener('mouseup', () => {
                if(isDragging) {
                    isDragging = false;
                    cardElement.style.cursor = 'grab';
                }
            });
        }

        // ==========================================
        // 4. ฟังก์ชันวาดเส้น (Logic คำนวณมุมการชี้)
        // ==========================================
        function updateAllLines() {
            svgOverlay.innerHTML = ''; 

            connections.forEach(conn => {
                const fromNode = nodes.find(n => n.id === conn.from);
                const toNode = nodes.find(n => n.id === conn.to);

                if (!fromNode || !toNode) return;

                const cardW = 130;
                const cardH = 180;
                
                const fromCenterX = fromNode.x + (cardW / 2);
                const fromCenterY = fromNode.y + (cardH / 2);
                const toCenterX = toNode.x + (cardW / 2);
                const toCenterY = toNode.y + (cardH / 2);

                // วาดเส้น
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", fromCenterX);
                line.setAttribute("y1", fromCenterY);
                line.setAttribute("x2", toCenterX);
                line.setAttribute("y2", toCenterY);
                line.setAttribute("class", conn.type === 'gold' ? "path-gold" : "path-black");
                
                // คำนวณหัวลูกศร
                const angle = Math.atan2(toCenterY - fromCenterY, toCenterX - fromCenterX);
                const arrowLength = 20;
                const arrowTipX = toCenterX;
                const arrowTipY = toCenterY;
                const arrowBase1X = arrowTipX - arrowLength * Math.cos(angle - Math.PI / 6);
                const arrowBase1Y = arrowTipY - arrowLength * Math.sin(angle - Math.PI / 6);
                const arrowBase2X = arrowTipX - arrowLength * Math.cos(angle + Math.PI / 6);
                const arrowBase2Y = arrowTipY - arrowLength * Math.sin(angle + Math.PI / 6);

                const arrowHead = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                arrowHead.setAttribute("points", `${arrowTipX},${arrowTipY} ${arrowBase1X},${arrowBase1Y} ${arrowBase2X},${arrowBase2Y}`);
                arrowHead.setAttribute("class", conn.type === 'gold' ? "arrow-head-gold" : "arrow-head");

                svgOverlay.appendChild(line);
                svgOverlay.appendChild(arrowHead);
            });
        }

        // ==========================================
        // 5. ระบบลบการ์ด (Creator Only)
        // ==========================================
        function deleteNode(nodeId) {
            if(confirm("คุณต้องการลบการ์ดนี้และเส้นที่เชื่อมอยู่ใช่หรือไม่?")) {
                // ลบ Node
                nodes = nodes.filter(n => n.id !== nodeId);
                // ลบ Connections ที่เกี่ยวข้อง
                connections = connections.filter(c => c.from !== nodeId && c.to !== nodeId);
                
                renderBoard();
            }
        }

        // ==========================================
        // 6. ปุ่มเพิ่มลูกศรสีทอง
        // ==========================================
        function addGoldenArrow() {
            const nextChapterName = prompt("ระบุชื่อบทถัดไปที่ต้องการเชื่อมต่อ (หรือพิมพ์ 'จบ' เพื่อจบบท):");
            if (!nextChapterName) return;

            const newId = 'gold_' + Date.now();
            const newX = 1200 + Math.random() * 200;
            const newY = 400 + Math.random() * 200;

            // เพิ่ม Node สำหรับบทถัดไป
            nodes.push({ id: newId, title: nextChapterName, x: newX, y: newY, type: 'gold_target' });
            
            // สมมติว่าลากเส้นมาจาก Node สุดท้าย (หรือ Node ที่เลือกอยู่)
            // ใน Prototype นี้ จะลากจาก choiceA ไปหาบทถัดไป
            const fromNodeId = 'choiceA'; 
            
            connections.push({ from: fromNodeId, to: newId, type: 'gold' });
            
            renderBoard();
        }

        // ==========================================
        // 7. การ Pan (ลากพื้นที่ว่าง)
        // ==========================================
        let isPanning = false;
        let startX, startY, scrollLeft, scrollTop;

        boardContainer.addEventListener('mousedown', (e) => {
            if (e.target.closest('.card')) return; 
            
            isPanning = true;
            boardContainer.style.cursor = 'grabbing';
            startX = e.pageX - boardContainer.offsetLeft;
            startY = e.pageY - boardContainer.offsetTop;
            scrollLeft = boardContainer.scrollLeft;
            scrollTop = boardContainer.scrollTop;
        });

        boardContainer.addEventListener('mouseleave', () => { isPanning = false; boardContainer.style.cursor = 'grab'; });
        boardContainer.addEventListener('mouseup', () => { isPanning = false; boardContainer.style.cursor = 'grab'; });

        boardContainer.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            e.preventDefault();
            const x = e.pageX - boardContainer.offsetLeft;
            const y = e.pageY - boardContainer.offsetTop;
            boardContainer.scrollLeft = scrollLeft - (x - startX) * 1.5;
            boardContainer.scrollTop = scrollTop - (y - startY) * 1.5;
        });

        // ปุ่มบันทึก
        function saveStoryline() {
            alert("บันทึกผัง Story Line สำเร็จ!");
            // ในระบบจริงจะยิง API เพื่อบันทึกข้อมูล nodes และ connections ลง Database
        }

        // เริ่มต้น
        renderBoard();

    </script>
</body>
</html>
