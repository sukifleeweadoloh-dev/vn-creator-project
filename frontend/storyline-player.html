<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Line - Player View</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --card-bg: #ebd8d0;
            --card-border: #d4b5a8;
            --card-text: #9c7b6f;
            --path-color: #1e293b;
            --gold-color: #fbbf24;
            
            /* สถานะการอ่าน */
            --status-read: #10b981;
            --status-current: #6366f1;
            --status-locked: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            height: 70px;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid #e2e8f0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-back {
            text-decoration: none;
            color: var(--text-dark);
            font-size: 28px;
            cursor: pointer;
            line-height: 1;
            transition: 0.2s;
        }
        .btn-back:hover { color: var(--primary); }

        .title-area h1 {
            font-size: 24px;
            font-weight: 800;
            color: #475569;
        }

        .header-right {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        /* โปรไฟล์นักเขียน */
        .author-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 20px;
            transition: background 0.2s;
        }
        .author-profile:hover { background: #f1f5f9; }
        
        .author-avatar {
            width: 35px;
            height: 35px;
            background: #6366f1;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
            object-fit: cover;
        }
        
        .author-name { font-size: 15px; font-weight: 600; color: var(--text-dark); }

        .btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
            font-family: 'Prompt';
        }

        .btn-follow { background: #e0e7ff; color: #4f46e5; border-color: #c7d2fe; }
        .btn-follow:hover { background: #c7d2fe; }
        .btn-follow.followed { background: #10b981; color: white; border-color: #10b981; }

        .btn-comment { background: #f8fafc; border-color: #e2e8f0; }
        .btn-comment:hover { background: #e2e8f0; }

        /* Board Area */
        #board-container {
            flex: 1;
            overflow: auto;
            position: relative;
            cursor: grab;
            background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px);
            background-size: 30px 30px;
        }
        #board-container:active { cursor: grabbing; }

        #board {
            position: relative;
            width: 3000px; 
            height: 2000px;
        }

        /* SVG Lines */
        #svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .path-black { stroke: var(--path-color); stroke-width: 6; fill: none; }
        .path-gold { stroke: var(--gold-color); stroke-width: 6; fill: none; }
        .arrow-head { fill: var(--path-color); }
        .arrow-head-gold { fill: var(--gold-color); }

        /* Cards */
        .card {
            position: absolute;
            width: 130px;
            height: 180px;
            background-color: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 6px;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.1), inset 0 0 0 4px var(--card-bg), inset 0 0 0 5px var(--card-border);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-weight: 600;
            color: var(--card-text);
            user-select: none;
            z-index: 10;
            transition: all 0.3s;
        }

        .card .main-text { font-size: 16px; line-height: 1.4; }
        .card .sub-text {
            font-size: 13px;
            color: #b8a097;
            margin-top: 5px;
            word-break: break-all;
            padding: 0 5px;
        }

        /* สถานะการอ่าน */
        .card.status-read {
            border-color: var(--status-read);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3), inset 0 0 0 5px var(--card-border);
        }
        .card.status-read::after {
            content: '✓ อ่านแล้ว';
            position: absolute;
            bottom: -25px;
            font-size: 12px;
            color: var(--status-read);
            background: white;
            padding: 2px 10px;
            border-radius: 10px;
            border: 1px solid var(--status-read);
        }

        .card.status-current {
            border-color: var(--status-current);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.5), inset 0 0 0 5px var(--card-border);
            transform: scale(1.05);
        }
        .card.status-current::after {
            content: '▶ กำลังอ่าน';
            position: absolute;
            bottom: -25px;
            font-size: 12px;
            color: white;
            background: var(--status-current);
            padding: 2px 10px;
            border-radius: 10px;
        }

        .card.status-locked {
            opacity: 0.5;
            border-color: var(--status-locked);
            filter: grayscale(0.8);
        }

        /* Card สำหรับบทถัดไป (สีทอง) */
        .card.card-gold {
            border-color: var(--gold-color) !important;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.4), inset 0 0 0 5px var(--card-border) !important;
        }

        /* Modal คอมเมนต์ */
        #comment-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .comment-modal-content {
            background: white;
            width: 90%;
            max-width: 500px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            max-height: 80vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .comment-header {
            padding: 15px 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .comment-header h3 { margin: 0; color: #1e293b; }

        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #64748b; }

        #comment-list {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f8fafc;
        }

        .comment-item { display: flex; gap: 10px; }

        .comment-avatar {
            width: 35px; height: 35px; border-radius: 50%;
            background: #6366f1; color: white;
            display: flex; justify-content: center; align-items: center;
            font-size: 14px; font-weight: bold; flex-shrink: 0;
            object-fit: cover;
        }

        .comment-body {
            background: white; padding: 10px 15px; border-radius: 10px;
            border: 1px solid #e2e8f0; font-size: 14px; color: #1e293b;
        }

        .comment-author-name { font-weight: 600; font-size: 13px; color: #6366f1; margin-bottom: 3px; }

        .comment-input-area {
            padding: 15px 20px; border-top: 1px solid #e2e8f0; display: flex; gap: 10px;
        }

        #comment-input {
            flex: 1; padding: 10px 15px; border: 1px solid #cbd5e1;
            border-radius: 20px; outline: none; font-family: 'Prompt';
        }

        #btn-send-comment {
            padding: 10px 20px; background: #6366f1; color: white;
            border: none; border-radius: 20px; font-weight: 600; cursor: pointer;
            font-family: 'Prompt';
        }

        /* Loading State */
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            color: var(--text-light);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <a href="play.html" class="btn-back" id="btn-back-play">&#8617;</a>
            <div class="title-area">
                <h1 id="novel-title">Story Line</h1>
            </div>
        </div>
        <div class="header-right">
            <!-- โปรไฟล์นักเขียน -->
            <div class="author-profile" id="author-profile-box" onclick="goToAuthorProfile()">
                <div class="author-avatar" id="author-avatar">?</div>
                <div class="author-name" id="author-name">กำลังโหลด...</div>
            </div>
            <button class="btn btn-follow" id="btn-follow">❤️ ติดตาม</button>
            <button class="btn btn-comment" onclick="openComments()">💬 คอมเมนต์</button>
        </div>
    </header>

    <div id="loading">กำลังโหลดข้อมูล...</div>

    <!-- Board -->
    <div id="board-container">
        <div id="board">
            <svg id="svg-overlay"></svg>
            <div id="cards-container"></div>
        </div>
    </div>

    <!-- Modal คอมเมนต์ -->
    <div id="comment-modal">
        <div class="comment-modal-content">
            <div class="comment-header">
                <h3>คอมเมนต์</h3>
                <button class="close-btn" onclick="closeComments()">&times;</button>
            </div>
            <div id="comment-list">
                <p style="text-align:center; color:#94a3b8;">กำลังโหลด...</p>
            </div>
            <div class="comment-input-area">
                <input type="text" id="comment-input" placeholder="พิมพ์คอมเมนต์...">
                <button id="btn-send-comment">ส่ง</button>
            </div>
        </div>
    </div>

    <!-- ⚠️ โหลด config.js ⚠️ -->
    <script src="js/config.js"></script>

    <script>
        // ==========================================
        // 1. ตัวแปรตั้งต้น
        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        const novelId = urlParams.get('id');
        
        // ดึงข้อมูลผู้ใช้
        let currentUser = null;
        try {
            const userStr = localStorage.getItem('user');
            if (userStr && userStr !== 'undefined' && userStr !== 'null') {
                currentUser = JSON.parse(userStr);
            }
        } catch (e) { console.error("LocalStorage Error"); }

        const userId = currentUser ? currentUser.id : null;

        let pagesData = []; 
        let nodes = [];     
        let connections = []; 
        let readingProgress = []; // เก็บ ID ของหน้าที่อ่านแล้ว
        let novelAuthorId = null;

        const board = document.getElementById('board');
        const svgOverlay = document.getElementById('svg-overlay');
        const cardsContainer = document.getElementById('cards-container');
        const loadingText = document.getElementById('loading');

        if (!novelId) {
            alert("ไม่พบข้อมูลนิยาย");
            window.location.href = 'index.html';
        }

        // อัปเดตลิงก์กลับไปหน้า Play
        document.getElementById('btn-back-play').href = `play.html?id=${novelId}`;

        // ==========================================
        // 2. ฟังก์ชันโหลดข้อมูลจาก Database
        // ==========================================
        async function fetchStoryline() {
            try {
                // ส่ง userId ไปด้วยเพื่อดึงประวัติการอ่าน
                const url = userId ? `${API}/novels/play/${novelId}?userId=${userId}` : `${API}/novels/play/${novelId}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error("โหลดข้อมูลไม่สำเร็จ");
                
                const data = await res.json();
                pagesData = data.pages || [];
                novelAuthorId = data.author_id;
                readingProgress = data.readingProgress || []; 
                
                if (pagesData.length === 0) {
                    loadingText.innerText = "ไม่มีข้อมูลหน้านิยาย";
                    return;
                }

                // หาหน้าที่อ่านล่าสุด (หน้าสุดท้ายที่อยู่ใน readingProgress)
                let currentPageId = null;
                if (readingProgress.length > 0) {
                    // สมมติว่า readingProgress เรียงลำดับตามการอ่าน หรือหาค่าที่ order_index สูงสุด
                    // เพื่อความง่าย ให้ใช้ตัวสุดท้ายที่บันทึกไว้ (หรือ max id)
                    currentPageId = Math.max(...readingProgress);
                }

                // แปลง Pages เป็น Nodes
                nodes = pagesData.map((p, index) => {
                    let status = 'locked';
                    if (readingProgress.includes(p.id)) {
                        status = 'read';
                    }
                    if (p.id === currentPageId) {
                        status = 'current';
                    }

                    return {
                        id: `page_${p.id}`,
                        pageId: p.id,
                        title: `หน้า ${p.order_index}`,
                        x: p.storyline_x || (100 + (index * 200)),
                        y: p.storyline_y || 400,
                        type: 'page',
                        status: status,
                        choices: p.choices || []
                    };
                });

                // สร้าง Connections
                connections = [];
                for (let i = 0; i < nodes.length - 1; i++) {
                    connections.push({ from: nodes[i].id, to: nodes[i+1].id, type: 'black' });
                }
                pagesData.forEach((p) => {
                    if (p.choices) {
                        p.choices.forEach(choice => {
                            if (choice.target_page_id) {
                                connections.push({ from: `page_${p.id}`, to: `page_${choice.target_page_id}`, type: 'black' });
                            }
                        });
                    }
                });

                // โหลดข้อมูลนักเขียน
                if (novelAuthorId) fetchAuthorInfo(novelAuthorId);

                // แสดงผล
                loadingText.style.display = 'none';
                renderBoard();

            } catch (err) {
                console.error(err);
                loadingText.innerText = "เกิดข้อผิดพลาดในการโหลดข้อมูล";
            }
        }

        // ==========================================
        // 3. ฟังก์ชัน Render
        // ==========================================
        function renderBoard() {
            cardsContainer.innerHTML = '';
            
            nodes.forEach(node => {
                const card = document.createElement('div');
                card.className = `card status-${node.status}`;
                card.id = node.id;
                card.style.left = `${node.x}px`;
                card.style.top = `${node.y}px`;

                let subText = '';
                if (node.choices.length > 0) {
                    const choiceTxt = node.choices[0].text || 'ตัวเลือก';
                    const shortTxt = choiceTxt.length > 5 ? choiceTxt.substring(0,5) + '...' : choiceTxt;
                    subText = `<div class="sub-text">${shortTxt}</div>`;
                }

                card.innerHTML = `
                    <div class="main-text">${node.title}</div>
                    ${subText}
                `;
                cardsContainer.appendChild(card);
            });

            updateAllLines();
        }

        function updateAllLines() {
            svgOverlay.innerHTML = ''; 

            connections.forEach(conn => {
                const fromNode = nodes.find(n => n.id === conn.from);
                const toNode = nodes.find(n => n.id === conn.to);

                if (!fromNode || !toNode) return;

                const cardW = 130;
                const cardH = 180;
                
                const fromCenterX = fromNode.x + (cardW / 2);
                const fromCenterY = fromNode.y + (cardH / 2);
                const toCenterX = toNode.x + (cardW / 2);
                const toCenterY = toNode.y + (cardH / 2);

                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", fromCenterX);
                line.setAttribute("y1", fromCenterY);
                line.setAttribute("x2", toCenterX);
                line.setAttribute("y2", toCenterY);
                line.setAttribute("class", conn.type === 'gold' ? "path-gold" : "path-black");
                
                const angle = Math.atan2(toCenterY - fromCenterY, toCenterX - fromCenterX);
                const arrowLength = 20;
                const arrowTipX = toCenterX;
                const arrowTipY = toCenterY;
                const arrowBase1X = arrowTipX - arrowLength * Math.cos(angle - Math.PI / 6);
                const arrowBase1Y = arrowTipY - arrowLength * Math.sin(angle - Math.PI / 6);
                const arrowBase2X = arrowTipX - arrowLength * Math.cos(angle + Math.PI / 6);
                const arrowBase2Y = arrowTipY - arrowLength * Math.sin(angle + Math.PI / 6);

                const arrowHead = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                arrowHead.setAttribute("points", `${arrowTipX},${arrowTipY} ${arrowBase1X},${arrowBase1Y} ${arrowBase2X},${arrowBase2Y}`);
                arrowHead.setAttribute("class", conn.type === 'gold' ? "arrow-head-gold" : "arrow-head");

                svgOverlay.appendChild(line);
                svgOverlay.appendChild(arrowHead);
            });
        }

        // ==========================================
        // 4. ระบบ Pan (ลากพื้นที่ว่าง)
        // ==========================================
        let isPanning = false;
        let startX, startY, scrollLeft, scrollTop;
        const boardContainer = document.getElementById('board-container');

        boardContainer.addEventListener('mousedown', (e) => {
            isPanning = true;
            boardContainer.style.cursor = 'grabbing';
            startX = e.pageX - boardContainer.offsetLeft;
            startY = e.pageY - boardContainer.offsetTop;
            scrollLeft = boardContainer.scrollLeft;
            scrollTop = boardContainer.scrollTop;
        });

        boardContainer.addEventListener('mouseleave', () => { isPanning = false; boardContainer.style.cursor = 'grab'; });
        boardContainer.addEventListener('mouseup', () => { isPanning = false; boardContainer.style.cursor = 'grab'; });

        boardContainer.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            e.preventDefault();
            const x = e.pageX - boardContainer.offsetLeft;
            const y = e.pageY - boardContainer.offsetTop;
            boardContainer.scrollLeft = scrollLeft - (x - startX) * 1.5;
            boardContainer.scrollTop = scrollTop - (y - startY) * 1.5;
        });

        // ==========================================
        // 5. ข้อมูลนักเขียน และปุ่มติดตาม
        // ==========================================
        async function fetchAuthorInfo(authorId) {
            try {
                const res = await fetch(`${API}/users/profile/${authorId}`);
                const data = await res.json();
                const author = data.user;

                if (author) {
                    document.getElementById('author-name').innerText = author.username;
                    const avatarEl = document.getElementById('author-avatar');
                    if (author.profile_pic) {
                        avatarEl.innerHTML = `<img src="${author.profile_pic}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                    } else {
                        avatarEl.innerText = author.username.charAt(0).toUpperCase();
                    }
                }
            } catch (err) { console.error(err); }
        }

        function goToAuthorProfile() {
            if (novelAuthorId) window.location.href = `profile.html?id=${novelAuthorId}`;
        }

        // ==========================================
        // 6. ระบบคอมเมนต์
        // ==========================================
        const commentModal = document.getElementById('comment-modal');
        const commentList = document.getElementById('comment-list');

        function openComments() {
            commentModal.style.display = 'flex';
            loadComments();
        }

        function closeComments() {
            commentModal.style.display = 'none';
        }

        commentModal.addEventListener('click', (e) => {
            if (e.target === commentModal) closeComments();
        });

        async function loadComments() {
            commentList.innerHTML = '<p style="text-align:center; color:#94a3b8;">กำลังโหลด...</p>';
            try {
                const res = await fetch(`${API}/novels/${novelId}/comments`);
                const comments = await res.json();

                if (comments.length === 0) {
                    commentList.innerHTML = '<p style="text-align:center; color:#94a3b8;">ยังไม่มีคอมเมนต์</p>';
                    return;
                }

                commentList.innerHTML = comments.map(c => {
                    const avatar = c.profile_pic 
                        ? `<img src="${c.profile_pic}" class="comment-avatar">` 
                        : `<div class="comment-avatar">${c.username.charAt(0).toUpperCase()}</div>`;

                    return `
                        <div class="comment-item">
                            ${avatar}
                            <div class="comment-body">
                                <div class="comment-author-name">${c.username}</div>
                                <div>${c.content}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) { commentList.innerHTML = '<p style="color:red;">โหลดไม่สำเร็จ</p>'; }
        }

        document.getElementById('btn-send-comment').addEventListener('click', async () => {
            if (!currentUser) return alert("กรุณาเข้าสู่ระบบก่อนคอมเมนต์");
            const input = document.getElementById('comment-input');
            const content = input.value.trim();
            if (!content) return;

            try {
                const res = await fetch(`${API}/novels/${novelId}/comments`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: currentUser.id, content: content })
                });
                if (res.ok) {
                    input.value = '';
                    loadComments();
                }
            } catch (err) { alert("ส่งไม่สำเร็จ"); }
        });

        // เริ่มต้นโหลดข้อมูล
        fetchStoryline();

    </script>
</body>
</html>
