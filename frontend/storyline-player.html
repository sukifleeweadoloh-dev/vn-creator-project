<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Line - Player View</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --card-bg: #ebd8d0;
            --card-border: #d4b5a8;
            --card-text: #9c7b6f;
            --path-color: #1e293b;
            --gold-color: #fbbf24;
            
            /* สถานะการอ่าน */
            --status-read: #10b981;
            --status-current: #6366f1;
            --status-locked: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            height: 70px;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid #e2e8f0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-back {
            text-decoration: none;
            color: var(--text-dark);
            font-size: 28px;
            cursor: pointer;
            line-height: 1;
            transition: 0.2s;
        }
        .btn-back:hover { color: var(--primary); }

        .title-area h1 {
            font-size: 24px;
            font-weight: 800;
            color: #475569;
        }

        .header-right {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        /* โปรไฟล์นักเขียน */
        .author-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 20px;
            transition: background 0.2s;
        }
        .author-profile:hover { background: #f1f5f9; }
        
        .author-avatar {
            width: 35px;
            height: 35px;
            background: #6366f1;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
        }
        
        .author-name { font-size: 15px; font-weight: 600; color: var(--text-dark); }

        .btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }

        .btn-follow { background: #e0e7ff; color: #4f46e5; border-color: #c7d2fe; }
        .btn-follow:hover { background: #c7d2fe; }
        
        .btn-comment { background: #f8fafc; border-color: #e2e8f0; }
        .btn-comment:hover { background: #e2e8f0; }

        /* Board Area */
        #board-container {
            flex: 1;
            overflow: auto;
            position: relative;
            cursor: grab;
            background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px);
            background-size: 30px 30px;
        }
        #board-container:active { cursor: grabbing; }

        #board {
            position: relative;
            width: 3000px; 
            height: 2000px;
        }

        /* SVG Lines */
        #svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .path-black { stroke: var(--path-color); stroke-width: 6; fill: none; }
        .path-gold { stroke: var(--gold-color); stroke-width: 6; fill: none; }
        .arrow-head { fill: var(--path-color); }
        .arrow-head-gold { fill: var(--gold-color); }

        /* Cards */
        .card {
            position: absolute;
            width: 130px;
            height: 180px;
            background-color: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 6px;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.1), inset 0 0 0 4px var(--card-bg), inset 0 0 0 5px var(--card-border);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-weight: 600;
            color: var(--card-text);
            user-select: none;
            z-index: 10;
            transition: all 0.3s;
        }

        .card .main-text { font-size: 16px; line-height: 1.4; }
        .card .sub-text {
            font-size: 13px;
            color: #b8a097;
            margin-top: 5px;
            word-break: break-all;
            padding: 0 5px;
        }

        /* สถานะการอ่าน */
        .card.status-read {
            border-color: var(--status-read);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3), inset 0 0 0 5px var(--card-border);
        }
        .card.status-read::after {
            content: '✓ อ่านแล้ว';
            position: absolute;
            bottom: -25px;
            font-size: 12px;
            color: var(--status-read);
            background: white;
            padding: 2px 10px;
            border-radius: 10px;
            border: 1px solid var(--status-read);
        }

        .card.status-current {
            border-color: var(--status-current);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.5), inset 0 0 0 5px var(--card-border);
            transform: scale(1.05);
        }
        .card.status-current::after {
            content: '▶ กำลังอ่าน';
            position: absolute;
            bottom: -25px;
            font-size: 12px;
            color: white;
            background: var(--status-current);
            padding: 2px 10px;
            border-radius: 10px;
        }

        .card.status-locked {
            opacity: 0.5;
            border-color: var(--status-locked);
            filter: grayscale(0.8);
        }
        
        /* แสดงเส้นทางที่เลือก */
        .chosen-path {
            stroke: var(--status-current); /* ไฮไลท์เส้นทางที่เลือก */
            stroke-width: 8;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <a href="play.html" class="btn-back">&#8617;</a>
            <div class="title-area">
                <h1>ชื่อเรื่อง (บทที่ 1)</h1>
            </div>
        </div>
        <div class="header-right">
            <!-- โปรไฟล์นักเขียน (คลิกได้) -->
            <div class="author-profile" onclick="window.location.href='profile.html?id=1'">
                <div class="author-avatar">A</div>
                <div class="author-name">Admin</div>
            </div>
            <!-- ปุ่มติดตาม -->
            <button class="btn btn-follow" onclick="alert('ติดตามนักเขียนแล้ว!')">❤️ ติดตาม</button>
            <!-- ปุ่มคอมเมนต์ -->
            <button class="btn btn-comment" onclick="openComments()">💬 คอมเมนต์</button>
        </div>
    </header>

    <!-- Board -->
    <div id="board-container">
        <div id="board">
            <svg id="svg-overlay"></svg>
            <div id="cards-container"></div>
        </div>
    </div>

    <!-- Modal คอมเมนต์ (ซ่อนไว้ก่อน) -->
    <div id="comment-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
        <div style="background:white; width:500px; border-radius:15px; padding:20px; display:flex; flex-direction:column; gap:15px;">
            <h2 style="color:var(--text-dark);">คอมเมนต์</h2>
            <div style="height:200px; overflow-y:auto; border:1px solid #e2e8f0; padding:10px; border-radius:8px;">
                <p style="font-size:14px; margin-bottom:10px;"><strong>User1:</strong> สนุกมากครับ!</p>
                <p style="font-size:14px;"><strong>User2:</strong> รอตอนต่อไปนะครับ</p>
            </div>
            <input type="text" placeholder="พิมพ์คอมเมนต์..." style="padding:10px; border-radius:8px; border:1px solid #cbd5e1; font-family:'Prompt';">
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button onclick="closeComments()" style="padding:8px 16px; border-radius:8px; border:none; background:#e2e8f0; cursor:pointer;">ปิด</button>
                <button onclick="alert('ส่งคอมเมนต์สำเร็จ')" style="padding:8px 16px; border-radius:8px; border:none; background:var(--primary); color:white; cursor:pointer;">ส่ง</button>
            </div>
        </div>
    </div>

    <script>
        const board = document.getElementById('board');
        const svgOverlay = document.getElementById('svg-overlay');
        const cardsContainer = document.getElementById('cards-container');
        const boardContainer = document.getElementById('board-container');

        // ==========================================
        // 1. Mock Data (จำลองข้อมูลประวัติการอ่านของผู้เล่น)
        // ==========================================
        let nodes = [
            { id: 'page1', title: 'หน้า 1', x: 100, y: 400, type: 'page', status: 'read' },
            { id: 'page2', title: 'หน้า 2', x: 350, y: 400, type: 'page', status: 'read' },
            { id: 'choiceA', title: 'สวัสดีชาวโลก', x: 650, y: 250, type: 'choice', status: 'read' }, 
            { id: 'choiceB', title: 'ลาก่อนนะครับ', x: 650, y: 550, type: 'choice', status: 'current' }, 
            { id: 'page3', title: 'หน้า 3', x: 950, y: 250, type: 'page', status: 'locked' }
        ];

        let connections = [
            { from: 'page1', to: 'page2', type: 'black', chosen: true },
            { from: 'page2', to: 'choiceA', type: 'black', chosen: true },
            { from: 'page2', to: 'choiceB', type: 'black', chosen: false }, // สมมติว่าผู้เล่นเลือก A ไปแล้ว
            { from: 'choiceA', to: 'page3', type: 'black', chosen: true }
        ];

        // ==========================================
        // 2. ฟังก์ชัน Render
        // ==========================================
        function formatLabel(text) {
            if (text.length > 5) return text.substring(0, 5) + '...';
            return text;
        }

        function renderBoard() {
            cardsContainer.innerHTML = '';
            svgOverlay.innerHTML = '';

            // วาดการ์ด
            nodes.forEach(node => {
                const card = document.createElement('div');
                card.className = `card status-${node.status}`; // ใส่คลาสตามสถานะ
                card.id = node.id;
                card.style.left = `${node.x}px`;
                card.style.top = `${node.y}px`;

                if (node.type === 'choice') {
                    card.innerHTML = `
                        <div class="main-text">หน้า</div>
                        <div class="sub-text">${formatLabel(node.title)}</div>
                    `;
                } else {
                    card.innerHTML = `<div class="main-text">${node.title}</div>`;
                }

                cardsContainer.appendChild(card);
            });

            // วาดเส้น
            updateAllLines();
        }

        function updateAllLines() {
            svgOverlay.innerHTML = ''; 

            connections.forEach(conn => {
                const fromNode = nodes.find(n => n.id === conn.from);
                const toNode = nodes.find(n => n.id === conn.to);

                if (!fromNode || !toNode) return;

                // ถ้าเป็นโหมดผู้เล่น เราจะแสดงเฉพาะเส้นทางที่เลือกไปแล้ว (chosen = true)
                // หรือถ้าไม่ต้องการซ่อนเส้นที่ไม่ได้เลือก ก็แสดงทั้งหมดแต่ทำให้จางลง
                if (!conn.chosen && toNode.status === 'locked') return; 

                const cardW = 130;
                const cardH = 180;
                
                const fromCenterX = fromNode.x + (cardW / 2);
                const fromCenterY = fromNode.y + (cardH / 2);
                const toCenterX = toNode.x + (cardW / 2);
                const toCenterY = toNode.y + (cardH / 2);

                // วาดเส้น
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", fromCenterX);
                line.setAttribute("y1", fromCenterY);
                line.setAttribute("x2", toCenterX);
                line.setAttribute("y2", toCenterY);
                line.setAttribute("class", conn.chosen ? "path-black chosen-path" : "path-black");
                
                // คำนวณหัวลูกศร
                const angle = Math.atan2(toCenterY - fromCenterY, toCenterX - fromCenterX);
                const arrowLength = 20;
                const arrowTipX = toCenterX;
                const arrowTipY = toCenterY;
                const arrowBase1X = arrowTipX - arrowLength * Math.cos(angle - Math.PI / 6);
                const arrowBase1Y = arrowTipY - arrowLength * Math.sin(angle - Math.PI / 6);
                const arrowBase2X = arrowTipX - arrowLength * Math.cos(angle + Math.PI / 6);
                const arrowBase2Y = arrowTipY - arrowLength * Math.sin(angle + Math.PI / 6);

                const arrowHead = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                arrowHead.setAttribute("points", `${arrowTipX},${arrowTipY} ${arrowBase1X},${arrowBase1Y} ${arrowBase2X},${arrowBase2Y}`);
                arrowHead.setAttribute("class", "arrow-head");

                svgOverlay.appendChild(line);
                svgOverlay.appendChild(arrowHead);
            });
        }

        // ==========================================
        // 3. ระบบ Pan (ลากพื้นที่ว่าง)
        // ==========================================
        let isPanning = false;
        let startX, startY, scrollLeft, scrollTop;

        boardContainer.addEventListener('mousedown', (e) => {
            isPanning = true;
            boardContainer.style.cursor = 'grabbing';
            startX = e.pageX - boardContainer.offsetLeft;
            startY = e.pageY - boardContainer.offsetTop;
            scrollLeft = boardContainer.scrollLeft;
            scrollTop = boardContainer.scrollTop;
        });

        boardContainer.addEventListener('mouseleave', () => { isPanning = false; boardContainer.style.cursor = 'grab'; });
        boardContainer.addEventListener('mouseup', () => { isPanning = false; boardContainer.style.cursor = 'grab'; });

        boardContainer.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            e.preventDefault();
            const x = e.pageX - boardContainer.offsetLeft;
            const y = e.pageY - boardContainer.offsetTop;
            boardContainer.scrollLeft = scrollLeft - (x - startX) * 1.5;
            boardContainer.scrollTop = scrollTop - (y - startY) * 1.5;
        });

        // ==========================================
        // 4. Modal คอมเมนต์
        // ==========================================
        function openComments() {
            document.getElementById('comment-modal').style.display = 'flex';
        }
        function closeComments() {
            document.getElementById('comment-modal').style.display = 'none';
        }

        // เริ่มต้น
        renderBoard();

    </script>
</body>
</html>
